name: Actualizador de Hydra

on:
  schedule:
    # Se ejecuta cada 6 horas (minuto 0)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Botón de ejecución manual

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar tu repositorio
      uses: actions/checkout@v4

    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar herramientas de extracción
      run: pip install cloudscraper beautifulsoup4

    - name: Arrancar el motor
      run: python hydra_skidrow_scraper.py

    - name: Guardar la base de datos JSON
      run: |
        git config --local user.email "bot@github.com"
        git config --local user.name "Hydra Scraper Bot"
        git add hydra_source.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizando catálogo de juegos" && git push)
